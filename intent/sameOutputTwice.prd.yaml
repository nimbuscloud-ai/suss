kind: prd

title: A second run gives the same output as the first
purpose: >-
  suss keeps a cache so a second extract over the same code is fast. The
  cache has to be invisible: a run served from it writes exactly what a
  run that read everything from scratch writes, so nobody has to wonder
  which one they are looking at.
audience: developers and CI jobs that keep a cache directory between runs
source: author

# The cache is part of extract, and the promise is that two outputs are
# equal, which no outcome can state. The tests run the built binary in a
# child process, which self.sussignore.yml explains.
scenarios:
  - title: nothing changed
    when: extract runs a second time over files that have not changed
    expect: it writes the same bytes the first run wrote
    coveredBy: packages/cli/src/extractCacheIntegration.test.ts > the extraction cache through the built binary > writes the cold run's output on a warm run over unchanged files
    about: fn:@suss/cli::extract

  - title: a file was touched but not changed
    when: a file's timestamp moved and its content did not, and extract runs again
    expect: it writes the same bytes the first run wrote
    coveredBy: packages/cli/src/extractCacheIntegration.test.ts > the extraction cache through the built binary > writes the cold run's output after a touch that changed no content
    about: fn:@suss/cli::extract

  - title: the cache against no cache
    when: extract runs once from a warm cache and once with --no-cache over the same files
    expect: the two outputs are byte for byte the same
    coveredBy: packages/cli/src/extractCacheIntegration.test.ts > the extraction cache through the built binary > writes what a run without the cache writes after re-reading one changed file
    about: fn:@suss/cli::extract

  - title: no cache at all
    when: extract runs twice with --no-cache over the same files
    expect: it writes the same bytes both times
    coveredBy: packages/cli/src/extractCacheIntegration.test.ts > the extraction cache through the built binary > writes the same bytes on two runs without the cache
    about: fn:@suss/cli::extract
