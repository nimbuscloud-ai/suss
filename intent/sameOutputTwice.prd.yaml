kind: prd

title: A second run gives the same output as the first
purpose: >-
  suss keeps a cache so a second extract over the same code is fast. The
  cache has to be invisible: a run served from it writes exactly what a
  run that read everything from scratch writes, so nobody has to wonder
  which one they are looking at.
audience: developers and CI jobs that keep a cache directory between runs
source: author

scenarios:
  # No link: the cache is part of extract, and the promise is that two
  # outputs are equal, which no outcome can state. Covered by the
  # @suss/cli test "writes the cold run's output on a warm run over
  # unchanged files".
  - title: nothing changed
    when: extract runs a second time over files that have not changed
    expect: it writes the same bytes the first run wrote

  # No link, for the same reason. Covered by the @suss/cli test "writes
  # the cold run's output after a touch that changed no content".
  - title: a file was touched but not changed
    when: a file's timestamp moved and its content did not, and extract runs again
    expect: it writes the same bytes the first run wrote

  # No link, for the same reason. The tests above compare a warm run
  # with the cold run that filled the cache, and none compares a warm
  # run with --no-cache yet.
  - title: the cache against no cache
    when: extract runs once from a warm cache and once with --no-cache over the same files
    expect: the two outputs are byte for byte the same
