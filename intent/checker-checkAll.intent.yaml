kind: boundary

name: checker-check-all
purpose: >-
  Pair every provider summary with the consumers on its boundary and
  return the findings, the pairs and what went unpaired for the whole
  set. suss check runs it, and a program calling the library uses it to
  check a set of summaries without the CLI.
audience: programs that check summaries through the library, including the suss CLI
source: author

boundary:
  transport: in-process
  semantics: function-call
  package: "@suss/checker"
  exportPath: ["checkAll"]
  receives:
    summaries: { type: array, required: true }

transitions:
  - id: result
    when: called with a list of behavioural summaries
    returns:
      body:
        properties:
          findings:
            type: array
            items:
              type: object
              properties:
                kind: { type: string }
                severity: { type: string }
          pairs: { type: array }
          unmatched:
            type: object
            properties:
              providers: { type: array }
              consumers: { type: array }
        required: [findings, pairs, unmatched]
