# System intent for an INTERNAL @suss/checker helper — deliberately
# keyed by module + exportName, not package + exportPath.
#
# describeBinding is not on @suss/checker's public export surface; it is a
# module-level helper. suss cannot yet key an in-process function-call
# boundary that lacks package + exportPath (see @suss/ir-core boundaryKey),
# so this intent is a valid but not-yet-checkable state: the checker reports
# it as `unkeyableBoundary` (warning) and lists it under `unchecked`. This
# is the named, accepted keying gap — the spec stays authored ahead of the
# capability rather than fabricating a package export that does not exist.

kind: boundary

name: checker-describe-binding
purpose: Produce a human-readable pairing-key label for a boundary binding.
audience: suss-cli
source: author

boundary:
  transport: in-process
  semantics: function-call
  module: packages/checker/src/index.ts
  exportName: describeBinding

transitions:
  - id: label
    when: called with any boundary binding
    returns:
      body:
        type: string

