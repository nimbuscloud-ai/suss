# Suppressions for the `check:self` run (npm run check:self).
#
# scripts/checkSelf.mjs copies this file into the generated summaries
# directory as .sussignore.yml, because `suss check --dir` auto-discovers
# suppressions from the summaries directory and has no --sussignore flag.
#
# Effects here use `mark`: the finding stays visible and non-gating but
# carries its justification inline. Nothing is hidden.

version: 1
rules:
  - kind: unkeyableBoundary
    boundary: "fn:packages/checker/src/index.ts::describeBinding"
    effect: mark
    reason: >-
      Accepted keying gap. describeBinding is an internal module-level
      helper, not a package export, so its intent boundary is authored
      with module + exportName. suss cannot yet key an in-process
      function-call boundary without package + exportPath (see
      @suss/ir-core boundaryKey), so this spec is a valid
      declared-ahead-of-capability state. Tracked in
      design/dogfood-intent-notes.md (module-level keying gap).
