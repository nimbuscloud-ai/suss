kind: boundary

name: checker-check-pair
purpose: >-
  Compare one provider with one consumer and return the findings. A
  program calling the library uses it when it has already decided which
  two summaries face each other.
audience: programs that check summaries through the library
source: author

boundary:
  transport: in-process
  semantics: function-call
  package: "@suss/checker"
  exportPath: ["checkPair"]
  receives:
    provider: { type: object, required: true }
    consumer: { type: object, required: true }

transitions:
  - id: findings
    when: called with a provider summary and a consumer summary
    returns:
      body:
        type: array
        items:
          type: object
          properties:
            kind: { type: string }
            severity: { type: string }
