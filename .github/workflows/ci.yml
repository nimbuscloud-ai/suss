name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The default GITHUB_TOKEN has contents: write for same-repo
          # pushes, which is what the dogfood baseline refresh on main
          # needs. fetch-depth: 0 gives that refresh a history to rebase
          # onto when a concurrent push beats it to the remote.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # For pull_request events, checkout defaults to a detached
          # merge commit, whose tree is the branch merged into main. Both
          # baseline gates ask whether a tree holds up the numbers
          # committed alongside it, so they have to run on the tree the
          # author committed rather than on a merge nobody wrote.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Turbo persists task outputs under .turbo/. Caching it between
      # runs lets `turbo build / test / lint / typecheck` hit "FULL TURBO"
      # for packages whose hashed inputs didn't change. Key includes the
      # commit SHA so each run writes its own cache entry; restore-keys
      # walk back to the nearest previous turbo cache. Invalidated
      # automatically when package-lock.json changes (dependency churn
      # affects task hashes).
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # A package that drifts back to private, or picks up a "*" range on
      # a sibling, only fails at publish time. Catching it on every PR
      # keeps the release step boring.
      - name: Publish readiness
        run: npm run check:publish

      # A package left out of the coverage list has no badge and no
      # baseline, so its coverage can fall to zero and the regression
      # gate will not notice. Four packages shipped that way.
      - name: Coverage list completeness
        run: npm run check:coverage-packages

      # Hand-authored SVG buys layout control and costs the guarantee
      # that a label fits where it was put. Two collisions shipped before
      # this ran.
      - name: Diagram geometry
        run: npm run check:diagrams

      # The style rules Biome has no rule for.
      - name: Style conventions
        run: npm run check:style

      # A pack that names an identifier its own library does not define
      # gives every other user false matches, and inflates coverage
      # measured against the codebase the name came from. Three packs
      # shipped one project's wrapper names before this ran.
      - name: Pack vocabulary
        run: npm run check:vocabulary

      # A generic file branching on a protocol name is how one route
      # got spelled two ways and a message-bus suppression rule
      # silently stopped matching. Protocol behavior comes from the
      # semantics registry; the pre-existing sites carry counts that
      # only go down.
      - name: Protocol dispatch
        run: npm run check:dispatch

      # The fixed-seed fuzz run: a few thousand generated programs
      # through the pipeline itself, in about twenty seconds. A shape
      # that works today and stops working fails the build the day it
      # lands, and the failure prints the minimized program rather than
      # whatever the sample happened to draw.
      - name: Fuzz (fixed seed)
        run: npm run check:fuzz

      - name: Test
        run: npm run test:coverage

      # Run suss against its own 38 packages. This is the widest test in
      # the repo: discovery, extraction, resolution and the checker over
      # a large TypeScript codebase rather than a fixture. It takes well
      # under a minute, so it stays in this job and reuses the build
      # above rather than paying for a second checkout and install.
      #
      # This step also fails when an invariant breaks: an export a
      # package declares that produced no summary, a recognised boundary
      # with no pairing key, a consumer that will not pair with the
      # provider next to it. None of those depend on a baseline.
      - name: Dogfood
        run: npm run dogfood

      # Fail when a count came out below the baseline committed in this
      # tree. The comparison is against HEAD, so an author who deleted
      # exports refreshes the baseline in the same branch and the drop
      # lands in the pull request diff for a reviewer to agree with.
      - name: Dogfood count check
        run: npm run check:dogfood

      # vitest writes coverage keyed by absolute path and minified. This
      # step rewrites it into the form the repo commits, so the check
      # below reads the same shape on both sides of the comparison.
      - name: Normalize coverage and regenerate badges
        run: npm run badges

      # Fail when a package's line coverage came out below the figure
      # committed in this tree. Same comparison as the dogfood count
      # check above, against the same ref, so neither gate can fail on a
      # package the branch never touched.
      - name: Coverage floor check
        run: npm run check:coverage

      # Raise the dogfood floor on main so it keeps up with the source.
      # Counts only ever act as a floor, so a merge that adds exports
      # leaves the committed number below what a run now sees, and
      # nothing on a branch refreshes it: the baseline belongs to the
      # author, because lowering it is how they say a drop was meant.
      #
      # This is the only file CI writes back. Coverage summaries and
      # badges belong to whoever changed the code they measure, and a
      # bot that rewrote them on main both raced the merge button and
      # overwrote a figure a reviewer had already read.
      #
      # Nothing reads this file from main, so a branch that has not
      # picked up the raise still passes: `check:dogfood` compares
      # against the branch's own HEAD.
      #
      # HUSKY=0 disables the local pre-commit and pre-push hooks the repo
      # uses for developers. CI has already run their equivalents
      # earlier in this workflow, and without it the bot's `git push`
      # would run the whole test suite again.
      #
      # A concurrent push can land between the checkout and the push, so
      # rebase against the remote tip and retry once. If it still races,
      # skip: the next push to main picks the raise up.
      - name: Raise the dogfood floor on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HUSKY: "0"
        run: |
          BASELINE=scripts/dogfood-baseline.json

          if git diff --quiet "$BASELINE"; then
            echo "Dogfood counts match the committed baseline, nothing to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BASELINE"
          git commit -m "chore: raise the dogfood baseline to what a run on main sees [skip ci]"

          for attempt in 1 2; do
            if git push origin HEAD:main; then
              echo "Pushed the raise on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt, rebasing and retrying."
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase failed, skipping. The next push to main re-triggers this."
              exit 0
            }
          done

          echo "Push still rejected after a rebase and a retry, skipping."
          exit 0
