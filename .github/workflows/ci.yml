name: CI

on:
  push:
    branches: [main]
  pull_request:

# A force-push (or a quick follow-up push) supersedes whatever run is
# already going for the same ref. Cancelling it instead of letting it
# finish saves minutes nobody is going to read the result of.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The work runs as three jobs at once, because one job doing everything
# in order took nine minutes and the three longest steps did not depend
# on each other. Wall clock is now the slowest of the three.
#
#   checks     lint, typecheck, build, and every check: script that
#              reads the tree rather than running it
#   test       the unit suite, then the badges it writes and the
#              coverage floor read from them
#   behaviour  dogfood, the fuzzers, and the acceptance journeys, which
#              run the CLI over fixtures
#
# `ci` is the required check. It stays a job of its own, needing the
# other three, so the name a branch ruleset asks for keeps reporting.
# Splitting them without it would leave every pull request waiting on a
# check that no longer exists.
#
# A docs-only change skips the steps only a code change needs. The
# checks that read documentation still run, because a docs-only diff is
# exactly what they exist to catch. The skip is a condition on each
# step rather than a paths filter on the workflow: a workflow a filter
# stops from running never reports, which leaves the pull request stuck.

jobs:
  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        id: prepare

      # Every package's exports point at dist, so anything that resolves
      # a sibling by name needs a build first. Turbo used to sequence
      # this through `typecheck dependsOn ^build`, and typecheck runs as
      # one tsc over the project graph now rather than through turbo.
      - name: Build
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run build

      - name: Lint
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run lint

      # One `tsc --build` over the project graph, not one process per
      # package. The incremental state under each package's .tsbuild is
      # cached, so an unchanged package costs nothing.
      - name: Cache the typecheck graph
        if: steps.prepare.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: "**/.tsbuild"
          key: tsbuild-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            tsbuild-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            tsbuild-${{ runner.os }}-

      - name: Typecheck
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run typecheck

      # A package that drifts back to private, or picks up a "*" range
      # on a sibling, only fails at publish time. Catching it on every
      # pull request keeps the release step boring.
      - name: Publish readiness
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run check:publish

      - name: Style conventions
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run check:style

      - name: Pack vocabulary
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run check:vocabulary

      - name: Protocol dispatch
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run check:dispatch

      - name: Metadata wiring
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run check:metadata-wiring

      - name: Boundary-name syntax
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run check:name-syntax

      - name: Pack wiring
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run check:packs

      # suss run on suss, through the shipped CLI, against the intent
      # documents in intent/. It breaks when a change to the checker's
      # public surface disagrees with what we wrote down about it.
      - name: Self check
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run check:self

      # These four read documentation, so they run whatever changed.
      - name: Coverage list completeness
        run: npm run check:coverage-packages

      - name: Diagram geometry
        run: npm run check:diagrams

      - name: Markdown links
        run: npm run check:doc-links

      - name: Findings catalog covers every kind
        run: npm run check:findings

      # The examples check runs the commands the pages show, so it needs
      # a CLI. A code change has one from the build above; a docs-only
      # change builds the one package.
      - name: Build the CLI for the documented examples
        if: steps.prepare.outputs.docs_only == 'true'
        run: npx turbo build --filter=@suss/cli

      - name: Documented examples
        run: npm run check:examples

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        id: prepare

      - name: Test
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run test:coverage

      # The badges are written from the coverage this run produced, and
      # the floor check reads them, so these three stay in order in the
      # one job.
      - name: Normalize coverage and regenerate badges
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run badges

      - name: Coverage floor check
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run check:coverage

  behaviour:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        id: prepare

      # These run the CLI over fixtures rather than going through turbo,
      # so nothing else here would build what they load.
      - name: Build
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run build

      - name: Fuzz (fixed seed)
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run check:fuzz

      - name: Acceptance journeys
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run test:acceptance

      # The count check reads what the dogfood run wrote, so the two
      # stay in order in the one job.
      - name: Dogfood
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run dogfood

      - name: Dogfood count check
        if: steps.prepare.outputs.docs_only != 'true'
        run: npm run check:dogfood

  # The name a branch ruleset requires. It does nothing but wait, so
  # that splitting the work above did not change what a pull request
  # has to satisfy.
  ci:
    runs-on: ubuntu-latest
    needs: [checks, test, behaviour]
    if: always()
    steps:
      - name: Report
        run: |
          echo "checks:    ${{ needs.checks.result }}"
          echo "test:      ${{ needs.test.result }}"
          echo "behaviour: ${{ needs.behaviour.result }}"
          if [ "${{ needs.checks.result }}" != "success" ] \
            || [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.behaviour.result }}" != "success" ]; then
            exit 1
          fi
