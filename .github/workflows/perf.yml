name: Perf

# What suss costs at main against what it cost at the last release:
# fixture extraction and dogfood wall time and peak memory, and packed
# tarball sizes. Both commits are built and measured on this runner in
# this job, taking turns, so the ratios compare like with like. The log
# says which two commits it compared and by how much each number moved.
# Weekly rather than per pull request, because building and measuring
# both takes about half an hour of runner time. Saturday early morning
# UTC is a quiet slot, offset from the top of the hour.
on:
  schedule:
    - cron: "47 5 * * 6"
  workflow_dispatch:
    inputs:
      base:
        description: The commit or tag to compare main against (default the last release before it)
        required: false
        default: ""
        type: string

# One run at a time. A manual dispatch during the scheduled run waits
# for it instead of cancelling a measurement mid-flight.
concurrency:
  group: perf-tracking

permissions:
  contents: read

jobs:
  perf:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      # The tags and the history behind them, so the base commit can be
      # found and checked out into a worktree of its own.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Fails when main's peak RSS is more than 1.25x the base's, its wall
      # time more than 1.5x, or a tarball grows more than 15% or 250KB.
      - name: Compare main with the base commit
        env:
          PERF_BASE: ${{ inputs.base }}
        run: node scripts/checkPerf.mjs ${PERF_BASE:+--base "$PERF_BASE"}
