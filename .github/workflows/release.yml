name: Release

# Publishing from here avoids the one-time password problem. npm's
# trusted publishing hands this workflow a short-lived credential over
# OIDC, so no token is stored and no code has to be typed in time.
#
# npm exchanges that credential one package at a time, against a trusted
# publisher the package names itself, so every package needs its own.
# On npmjs.com, under Packages -> the package -> Settings -> Trusted
# Publisher, pick GitHub Actions and fill in:
#
#   Organization or user  nimbuscloud-ai
#   Repository            suss
#   Workflow filename     release.yml     (the name alone, no path)
#   Environment name      (leave empty)
#   Allowed actions       npm publish
#
# A package that has not been set up that way gets no credential and
# fails on its own; the rest still go out. There is no token to fall back
# on, so if the job cannot mint an OIDC token at all the release stops
# before it writes anything, rather than reporting ENEEDAUTH once per
# package and leaving the cause to guess at.
#
# npm attaches provenance by itself when it publishes this way, so
# nothing here passes --provenance.
#
# The version is whatever the root package.json says. Somebody raises it
# with `npm run bump` and commits that first, so this workflow publishes
# a number a pull request approved rather than one it worked out here.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: List what would publish and show the notes, and publish nothing
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # OIDC needs this to mint the credential npm checks.
      id-token: write
      # The tag is pushed and the GitHub release is written under this
      # one. Releases are part of the contents scope, so nothing else
      # has to be granted for them.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The notes are read out of the history between the last tag
          # and here, and a shallow clone has neither.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, which is ahead of
      # what any Node release currently bundles.
      - name: Use an npm that can publish over OIDC
        run: npm install --global npm@latest

      - run: npm ci

      - name: Check every package is ready to publish
        run: npm run check:publish

      - run: npm run build

      - name: Run the tests
        run: npm test

      - name: Read the version being released
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error::v${VERSION} is already tagged. Run \`npm run bump\` and land that before releasing again."
            exit 1
          fi

      # Written before anything is published, so a dry run shows the
      # same notes the release would carry. The step summary is where
      # someone reads them without digging through the log.
      #
      # The file lands outside the checkout, because the publish refuses
      # to run against a working tree with anything uncommitted in it,
      # and it also has to be written before the tag exists: the notes
      # run from the last tag to here.
      - name: Write the release notes
        run: |
          node scripts/changelog.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --output "${{ runner.temp }}/release-notes.md"
          {
            echo "## v${{ steps.version.outputs.version }}"
            echo
            cat "${{ runner.temp }}/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set the committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish
        id: publish
        run: |
          node scripts/release.mjs \
            --skip-build \
            --verbose \
            ${{ inputs.dry-run && '--dry-run' || '' }}

      - name: Tag the commit that was published
        if: ${{ !inputs.dry-run }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Annotated rather than lightweight, because a lightweight tag
          # is skipped by --follow-tags and by anything else that reads
          # tag objects. The release below hangs on this tag, so it has
          # to be on the remote before that runs.
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push --no-verify origin "v${VERSION}"

      - name: Cut the GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file "${{ runner.temp }}/release-notes.md" \
            --verify-tag \
            --latest
