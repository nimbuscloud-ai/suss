name: Fuzz

# The fixed-seed suites run on every pull request under CI's test step.
# This one runs the same generators for longer and at random seeds, so
# it reaches shapes a fixed seed never draws. Nightly, plus on demand.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      programs:
        description: Programs per family
        default: "2000"
      pythonPrograms:
        description: Programs for the Python differential
        default: "1000"

jobs:
  fuzz:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Every bug the fuzzer knows about is written down in
      # src/shape/knownBugs.ts. This run fails on a finding that is not
      # in that list, and on a pinned bug that stopped reproducing,
      # which is a fix somebody landed without promoting the dimension
      # value. Either way the log carries the minimized program.
      - name: Property suites and shapes, at a seed from the clock
        run: npm run fuzz:long
        env:
          FUZZ_PROGRAMS: ${{ inputs.programs || '4000' }}

      # The datalog and resolution suites run at a pinned seed under CI,
      # so this is the only place their generators draw anything new.
      - name: The datalog and resolution properties, at a seed from the clock
        if: ${{ !cancelled() }}
        run: npm run fuzz:properties
        env:
          SUSS_FUZZ_SEED: ${{ github.run_id }}

      # The Python differential needs an interpreter and the target
      # frameworks, which only this workflow installs: the runtime
      # side of a fuzz target lives in CI, never in any shipped
      # package. It runs even when the TypeScript families failed, so
      # one family's finding does not hide the other's.
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"

      - name: Install the Python differential's frameworks
        if: ${{ !cancelled() }}
        run: python3 -m pip install -r tools/differential/python/requirements.txt

      - name: The Python differential, at a seed from the clock
        if: ${{ !cancelled() }}
        run: npm run check:fuzz-python -- "${{ inputs.pythonPrograms || '1000' }}" "$(date +%s)"
