name: Warm turbo cache
description: >
  Save a merged pull request's turbo cache entry under main's own ref,
  from the artifact its CI run uploaded. GitHub scopes a cache entry to
  the ref that saved it, so an entry a pull request's branch saved is
  invisible to the next pull request; this makes it visible on main,
  without rebuilding anything.

  The merged commit's hash matches an artifact only when nothing that
  turbo reads merged between the pull request's last CI run and its
  merge. When it does not, the newest artifact for this job is saved
  under the hash in its own name instead. The turbo-cache action
  restores by the turbo-<job>-<os>- prefix when the exact key misses,
  so the next pull request still starts from that entry.

inputs:
  job:
    description: The job name the entry belongs to (checks, test or behaviour).
    required: true
  hash:
    description: The turbo-hash output for the commit being warmed.
    required: true
  github-token:
    description: "Token with the actions:read permission, to read artifacts from the run that uploaded them."
    required: true
  tsbuild:
    description: Whether the artifact also carries the typecheck graph, and should seed that cache entry too.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Look up the artifact
      id: find
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PREFIX: turbo-${{ inputs.job }}-
        HASH: ${{ inputs.hash }}
      run: |
        newest_run() {
          gh api --paginate "repos/$GH_REPO/actions/artifacts?name=$1" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty'
        }
        RUN_ID=$(newest_run "$PREFIX$HASH")
        if [ -z "$RUN_ID" ]; then
          echo "No artifact named $PREFIX$HASH; something turbo reads merged after this pull request's last run."
          # The artifacts endpoint matches a name exactly, so the newest
          # entry with this prefix comes from listing recent artifacts.
          NEWEST=$(gh api "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and (.name | startswith(env.PREFIX)))] | sort_by(.created_at) | last | select(. != null) | "\(.name) \(.workflow_run.id)"')
          if [ -z "$NEWEST" ]; then
            echo "No artifact with the prefix $PREFIX either. Skipping ${{ inputs.job }}."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HASH=${NEWEST%% *}
          HASH=${HASH#"$PREFIX"}
          RUN_ID=${NEWEST##* }
          echo "Saving the newest artifact for this job, $PREFIX$HASH, so the next pull request restores it by prefix."
        fi
        echo "found=true" >> "$GITHUB_OUTPUT"
        echo "hash=$HASH" >> "$GITHUB_OUTPUT"
        echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

    - name: Download the artifact
      if: steps.find.outputs.found == 'true'
      uses: actions/download-artifact@v4
      with:
        name: turbo-${{ inputs.job }}-${{ steps.find.outputs.hash }}
        run-id: ${{ steps.find.outputs.run-id }}
        github-token: ${{ inputs.github-token }}

    - name: Save the turbo cache entry
      if: steps.find.outputs.found == 'true'
      uses: actions/cache/save@v4
      with:
        path: .turbo
        key: turbo-${{ inputs.job }}-${{ runner.os }}-${{ steps.find.outputs.hash }}

    - name: Save the typecheck graph entry
      if: steps.find.outputs.found == 'true' && inputs.tsbuild == 'true'
      uses: actions/cache/save@v4
      with:
        path: "**/.tsbuild"
        key: tsbuild-${{ runner.os }}-${{ steps.find.outputs.hash }}
