name: Turbo cache
description: >
  Restore the turbo cache a job of this name saved last. Runs after
  checkout and before the first turbo task. Call the turbo-cache-save
  action with if: always() as a step of the job itself, once turbo has
  run, to save what it produced even when a later step failed.

  The key is this commit's turbo-hash. Two runs over the same sources
  share a key, so the second finds an exact hit and there is nothing
  new for the save step to write. A run over changed sources misses the
  exact key, restores the newest entry for this job name, and replays
  whatever turbo still recognises.

  The name keeps the jobs of one run from racing for a single key. Each
  job name has its own line of entries; the nightly regenerate job
  saves under every name so a new branch starts from last night's main,
  and the warm-cache workflow saves a merged pull request's entry under
  main's own ref right after it lands.

inputs:
  name:
    description: Which line of entries to restore. Usually the job name.
    required: true

outputs:
  inputs:
    description: The hash of the sources turbo reads, for other caches that move with them.
    value: ${{ steps.hash.outputs.hash }}
  key:
    description: The cache key this run restored, for turbo-cache-save to reuse.
    value: ${{ steps.key.outputs.key }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/turbo-hash
      id: hash

    - name: Compute the cache key
      id: key
      shell: bash
      run: echo "key=turbo-${{ inputs.name }}-${{ runner.os }}-${{ steps.hash.outputs.hash }}" >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@v4
      with:
        path: .turbo
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          turbo-${{ inputs.name }}-${{ runner.os }}-

    # A restored entry is saved back whole, so artifacts would pile up
    # across the chain of runs. A package untouched for two weeks gets
    # rebuilt once and saved fresh, which bounds the entry.
    - name: Drop stale artifacts
      shell: bash
      run: |
        if [ -d .turbo/cache ]; then
          find .turbo/cache -type f -mtime +14 -delete
        fi
