AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: One route, built the same way in every compatibility case.

Resources:
  ThingApi:
    Type: AWS::Serverless::HttpApi

  GetThingFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      CodeUri: .
      Handler: src/handler.handler
      Events:
        GetThing:
          Type: HttpApi
          Properties:
            Method: GET
            Path: /things/{id}
