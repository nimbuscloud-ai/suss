AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Widget catalog service — invented fixture for the aws-lambda pack.

Globals:
  Function:
    Runtime: nodejs20.x
    CodeUri: .
    Timeout: 10

Resources:
  # Explicit HTTP API — the Function HttpApi Events attach here, so the
  # declared-route summaries pair against the extracted handlers.
  WidgetHttpApi:
    Type: AWS::Serverless::HttpApi

  ConfirmTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/confirmToken.handler
      Events:
        Confirm:
          Type: HttpApi
          Properties:
            Method: POST
            Path: /tokens/{tokenId}/confirm

  ListWidgetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/listWidgets.handler
      Events:
        List:
          Type: HttpApi
          Properties:
            Method: GET
            Path: /widgets

  # One function bound to two route Events (GET + DELETE on the same path).
  WidgetItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/widgetItem.handler
      Events:
        Get:
          Type: HttpApi
          Properties:
            Method: GET
            Path: /widgets/{widgetId}
        Remove:
          Type: HttpApi
          Properties:
            Method: DELETE
            Path: /widgets/{widgetId}

  # HTTP handler whose two envelopes sit in a ternary at the return site.
  ToggleFlagFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/toggleFlag.handler
      Events:
        Toggle:
          Type: HttpApi
          Properties:
            Method: POST
            Path: /flags/toggle

  # HTTP handler that returns a variable the pack cannot read.
  MirrorRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/mirrorRequest.handler
      Events:
        Mirror:
          Type: HttpApi
          Properties:
            Method: GET
            Path: /mirror

  # Non-HTTP handler on a timer. Answers with an arbitrary summary object.
  ScheduledSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/scheduledSync.handler
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)

  # Non-HTTP handler — surfaces as recognized-not-http accounting.
  QueueWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/queueWorker.handler
      Events:
        Jobs:
          Type: SQS
          Properties:
            Queue: !GetAtt JobsQueue.Arn

  # SQS consumer whose export a handler factory of the project's own
  # built, so the walk reaches the body through the factory.
  SubjectWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/subjectWorker.handler
      Events:
        Invoices:
          Type: SQS
          Properties:
            Queue: !GetAtt InvoicesQueue.Arn

  # Two Lambdas answer one subject, each behind its own queue. Both
  # queues are fed by the rule that routes `order.placed`, so the
  # subject alone would pair every handler with every subscription.
  OrderIndexerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/orderIndexer.handler
      Events:
        Orders:
          Type: SQS
          Properties:
            Queue: !GetAtt OrderIndexerQueue.Arn

  OrderNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/orderNotifier.handler
      Events:
        Orders:
          Type: SQS
          Properties:
            Queue: !GetAtt OrderNotifierQueue.Arn

  OrderPlacedRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        detail-type:
          - order.placed
      Targets:
        - Id: indexer
          Arn: !GetAtt OrderIndexerQueue.Arn
        - Id: notifier
          Arn: !GetAtt OrderNotifierQueue.Arn

  JobsQueue:
    Type: AWS::SQS::Queue

  InvoicesQueue:
    Type: AWS::SQS::Queue

  OrderIndexerQueue:
    Type: AWS::SQS::Queue

  OrderNotifierQueue:
    Type: AWS::SQS::Queue

  # Fed by a queue and a timer at once, so no one wire covers it.
  MixedTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/mixedTrigger.handler
      Events:
        Drain:
          Type: SQS
          Properties:
            Queue: !GetAtt JobsQueue.Arn
        Sweep:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
