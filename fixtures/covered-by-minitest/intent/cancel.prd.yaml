kind: prd
title: Cancel an order
purpose: A customer cancels an order they no longer want.
audience: customers
scenarios:
  - title: cancelled
    when: a customer cancels an order
    expect: the order is cancelled
    coveredBy: test/models/order_test.rb > OrderTest > test_marks_the_order_cancelled
    about: cancel
  - title: renamed test
    when: a customer cancels an order again
    expect: nothing changes
    coveredBy: test/models/order_test.rb > OrderTest > test_cancels_an_order_twice
    about: cancel
  - title: wrong subject
    when: a refund follows a cancel
    expect: the payment goes back
    coveredBy: test/models/order_test.rb > OrderTest > test_refunds_the_payment
    about: cancel
  - title: skipped
    when: an order is cancelled twice
    expect: the second cancel does nothing
    coveredBy: test/models/order_test.rb > OrderTest > test_cancels_twice_without_harm
    about: cancel
  - title: mocked
    when: a checkout fails
    expect: the order is cancelled
    coveredBy: test/services/checkout_test.rb > CheckoutTest > test_cancels_on_a_failed_checkout
    about: cancel
  - title: through a fixture
    when: a cancelled order is read back
    expect: it says it is cancelled
    coveredBy: test/models/order_test.rb > OrderTest > test_reads_back_as_cancelled
    about: cancel
  - title: nothing yet
    when: an order that shipped is cancelled
    expect: the customer is told it is too late
