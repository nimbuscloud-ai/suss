# Worked example, v0.2 territory. NOT loadable by the shipped v0.1
# loader — kind: workflow and effect outcomes are proposed shapes.

kind: workflow

name: order-intake
purpose: |
  Accept an order, persist it (implicit in this fixture), and queue it
  for downstream processing. Acknowledges the caller.

boundary:
  transport: function-call
  semantics: function-call
  module: order-producer/index
  exportName: handler

transitions:
  - id: acknowledged
    when: order was queued without error
    output:
      status: null
      body:
        properties:
          ok: { type: boolean }

effects:
  - id: queued-for-processing
    kind: message-send
    target:
      transport: aws-sqs
      queue: OrdersQueue
    body:
      properties:
        id:    { type: string }
        total: { type: number }
