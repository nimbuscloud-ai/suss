# Worked example for the intent-layer-design proposal, v0.2 territory
# (workflow shape + non-HTTP boundaries). NOT loadable by the shipped
# v0.1 loader — kind: workflow, effect outcomes, and multi-target
# links are proposed shapes. Field naming tracks the settled v0.1
# convention: `when` / `expect` are human text, `link` is the
# structured reference.

kind: prd

title: Order intake and processing
purpose: |
  When a customer places an order, the system records the order, queues
  it for downstream processing, and acknowledges the request. The
  processing job picks up queued orders and acts on them.
audience: end-user

scenarios:
  - title: Order is accepted and queued
    when: a customer places a valid order
    expect: the order is acknowledged and queued for processing
    link:
      - order-intake.acknowledged
      - order-intake.queued-for-processing

  - title: Processing acts on the queued order
    when: an accepted order reaches the processor
    expect: the processor handles the order
    link:
      - order-processing.processed
