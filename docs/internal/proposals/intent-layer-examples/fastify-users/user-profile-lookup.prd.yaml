# Worked example for the intent-layer-design proposal.
#
# Author-facing PRD shape (kind: prd). The team's product description
# of how user profile lookup should behave from the user's point of
# view. Each scenario reads on its own through `when` / `then`; the
# optional `expect` is the structured link to a system-intent outcome
# (here pre-filled, but a facilitator could supply it later — a PRD
# with `when` / `then` and no `expect` is a valid pending-link state).

kind: prd

title: User profile lookup
purpose: |
  The client app can fetch a user's profile information by id. The
  endpoint should distinguish between missing input, unknown users,
  and admin users (who get an enriched profile).
audience: web-client

scenarios:
  - title: Successful lookup
    when: a request arrives with a known user id
    then: the caller receives the user's profile
    expect: users-lookup.found

  - title: Admin gets enriched data
    when: the looked-up user has the admin role
    then: the caller receives the profile with admin details
    expect: users-lookup.found-admin

  - title: Missing id
    when: the request omits the id parameter
    then: the caller is told the id is required
    expect: users-lookup.missing-id

  - title: Unknown user
    when: the id doesn't match any record
    then: the caller is told the user wasn't found
    expect: users-lookup.not-found
