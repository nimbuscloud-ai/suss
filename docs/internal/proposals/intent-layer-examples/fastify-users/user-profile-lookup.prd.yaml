# Worked example for the intent-layer-design proposal.
#
# Author-facing PRD shape (kind: prd), in the SHIPPED v0.1 schema —
# this file loads through @suss/contract-intent as written. Each
# scenario reads on its own through `when` / `expect` (both human
# text); the optional `link` is the structured reference to a system
# intent's transition id (`<intent-name>.<transition-id>`). A scenario
# with no `link` is a valid pending state — the checker reports it as
# unlinkedScenario (info), never an error.

kind: prd

title: User profile lookup
purpose: |
  The client app can fetch a user's profile information by id. The
  endpoint should distinguish between missing input, unknown users,
  and admin users (who get an enriched profile).
audience: web-client

scenarios:
  - when: a request arrives with a known user id
    expect: the caller receives the user's profile
    link: users-lookup.found

  - when: the looked-up user has the admin role
    expect: the caller receives the profile with admin details
    link: users-lookup.found-admin

  - when: the request omits the id parameter
    expect: the caller is told the id is required
    link: users-lookup.missing-id

  - when: the id doesn't match any record
    expect: the caller is told the user wasn't found
    link: users-lookup.not-found
