# Worked example for the intent-layer-design proposal.
#
# System intent shape (kind: boundary), in the SHIPPED v0.1 schema —
# this file loads through @suss/contract-intent as written. The
# engineer's declaration of what the system does: every outcome the
# boundary can produce, named by id so PRD scenarios can link to them.
# Specificity is at the contract level (status codes, body shapes);
# this is what the checker compares against derived code.

kind: boundary

name: users-lookup
purpose: GET /users/:id retrieves a single user record.
audience: web-client
source: author

boundary:
  transport: http
  semantics: rest
  method: GET
  path: /users/:id

transitions:
  - id: missing-id
    when: id parameter is empty
    response:
      status: 400
      body:
        properties:
          error: { type: string }

  - id: not-found
    when: user with the requested id does not exist
    response:
      status: 404
      body:
        properties:
          error: { type: string }

  - id: found-admin
    when: user is an admin
    response:
      status: 200
      body:
        properties:
          id: { type: string }
          name: { type: string }
          role: { type: string }
          admin: { type: boolean }

  - id: found
    when: user exists and is not an admin
    response:
      status: 200
      body:
        properties:
          id: { type: string }
          name: { type: string }
          role: { type: string }
