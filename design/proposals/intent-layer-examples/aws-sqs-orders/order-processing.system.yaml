# Worked example, v0.2 territory. NOT loadable by the shipped v0.1
# loader — kind: workflow and queue-source inputs are proposed shapes.

kind: workflow

name: order-processing
purpose: Process orders received from the queue.

boundary:
  transport: function-call
  semantics: function-call
  module: order-consumer/index
  exportName: handler

inputs:
  - source:
      transport: aws-sqs
      queue: OrdersQueue
    body:
      properties:
        id:    { type: string }
        total: { type: number }

transitions:
  - id: processed
    when: every record in the batch
    output:
      status: null
      body:
        properties:
          ok: { type: boolean }
